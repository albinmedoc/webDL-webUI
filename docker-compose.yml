version: '3.8'

services:
  svtplay-dl-webui:
    build:
      context: .
    ports:
      - "3001:3001"
    volumes:
      # Persistent state: downloads, SQLite DB, RAR/PAR2 work dir, NZBs.
      # Single mount — everything the app writes lives under /data.
      - ./data:/data

      # Required for Usenet uploads: bind-mount a host rar binary. The
      # image does not bundle rar — provide one yourself, subject to the
      # RARLAB license at https://www.rarlab.com/license.htm.
      # - /usr/local/bin/rar:/usr/local/bin/rar:ro

      # Optional: mount a custom indexer hook script. The bundled ones live at
      # /app/hooks/indexers/ inside the image — no mount needed for those.
      # - ./my-hook.sh:/opt/hooks/my-hook.sh:ro
    environment:
      - NODE_ENV=production
      - PORT=3001

      # ───────────────── Usenet pipeline (opt-in) ─────────────────
      # Uncomment and fill these to enable Usenet auto-posting. The whole
      # subsystem stays inert when USENET_ENABLED is unset or false.
      # - USENET_ENABLED=true
      # - USENET_HOST=news.eweka.nl
      # - USENET_PORT=563
      # - USENET_SSL=true
      # - USENET_USER=your-user
      # - USENET_PASS=your-pass
      # - USENET_CONNECTIONS=20
      # - USENET_GROUPS=alt.binaries.boneless
      # - USENET_PAR2_PERCENT=10
      # - USENET_RAR_SIZE_MB=50
      # - USENET_MAX_CONCURRENT=2
      # - USENET_MIN_FREE_DISK_MULTIPLIER=3
      # - USENET_SUBJECT_TEMPLATE=[{filename}] - "{rarname}" yEnc ({part}/{total})
      # - USENET_NFO_PATH=/data/template.nfo
      # - USENET_NYUU_EXTRA_ARGS=

      # ───────────────────── Indexer hook ──────────────────────
      # Bundled hooks (see hooks/indexers/ in the repo):
      # - INDEXER_HOOK_SCRIPT=/app/hooks/indexers/drunkenslug.sh
      # - DRUNKENSLUG_UPLOAD_URL=https://nzbs.drunkenslug.com/upload.php

      # Custom paths (defaults point inside /data; override only if needed):
      # - DB_PATH=/data/svtplay-dl-webui.db
      # - USENET_WORK_DIR=/data/work
      # - NZB_OUTPUT_DIR=/data/nzb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
